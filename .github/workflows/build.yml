---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * *'  # 10:05am UTC everyday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just image_name)

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        run: |
          DEFAULT_TAG=$(just generate-default-tag)

          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # This actually builds the container image
      - name: Build Image
        id: build-image
        run: |
          just build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # This is optional, this provides smaller delta updates
      - name: Rechunk with rpm-ostree
        id: rechunk
        run: |
          just ostree-rechunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # If you are feeling adventurous, use the new distro agnostic rechunker
      # https://github.com/coreos/chunkah
      # You can delete the Rechunk with rpm-ostree portion then if you use this
      #- name: Rechunk with Chunkah
      #  id: rechunk
      #  run: |
      #    just rechunk \
      #      ${IMAGE_NAME} \
      #      ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail

          inspect_local_digest() {
            local image_ref="$1"
            local digest=""

            digest="$(podman image inspect "$image_ref" --format '{{.Digest}}' 2>/dev/null || true)"
            if [ -n "${digest}" ]; then
              printf '%s\n' "${digest}"
              return 0
            fi

            if command -v skopeo >/dev/null 2>&1; then
              digest="$(skopeo inspect --format '{{.Digest}}' "containers-storage:localhost/${image_ref}" 2>/dev/null || true)"
              if [ -n "${digest}" ]; then
                printf '%s\n' "${digest}"
              fi
            fi
          }

          inspect_remote_digest() {
            local image_ref="$1"

            if command -v skopeo >/dev/null 2>&1; then
              skopeo inspect --format '{{.Digest}}' "docker://${image_ref}" 2>/dev/null || true
            fi
          }

          retry_push() {
            local source_ref="$1"
            local destination_ref="$2"
            local attempt=1
            local max_attempts=5
            local sleep_seconds=15

            while true; do
              if podman push --digestfile=/tmp/digestfile "$source_ref" "$destination_ref"; then
                return 0
              fi

              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Push failed after ${max_attempts} attempts for ${destination_ref}" >&2
                return 1
              fi

              echo "Push failed for ${destination_ref}; retrying in ${sleep_seconds}s (attempt ${attempt}/${max_attempts})"
              sleep "${sleep_seconds}"
              attempt=$((attempt + 1))
              sleep_seconds=$((sleep_seconds * 2))
            done
          }

          local_digest="$(inspect_local_digest "${IMAGE_NAME}:${DEFAULT_TAG}" || true)"
          final_digest=""

          if [ -n "${local_digest}" ]; then
            echo "Resolved local image digest: ${local_digest}"
          else
            echo "Local image digest unavailable before push; tags will be pushed unless remote inspection later matches a pushed digest"
          fi

          for tag in ${ALIAS_TAGS}; do
            remote_ref="${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
            remote_digest="$(inspect_remote_digest "${remote_ref}" || true)"

            if [ -n "${local_digest}" ] && [ -n "${remote_digest}" ] && [ "${local_digest}" = "${remote_digest}" ]; then
              echo "Skipping ${remote_ref}; remote tag already points to ${remote_digest}"
              final_digest="${final_digest:-${remote_digest}}"
              continue
            fi

            retry_push "${IMAGE_NAME}:${tag}" "${remote_ref}"

            pushed_digest=$(< /tmp/digestfile)
            final_digest="${pushed_digest}"
            local_digest="${local_digest:-${pushed_digest}}"
          done

          if [ -z "${final_digest}" ]; then
            final_digest="${local_digest:-}"
          fi

          if [ -z "${final_digest}" ]; then
            echo "Unable to determine image digest after processing tags" >&2
            exit 1
          fi

          echo "digest=${final_digest}" >> $GITHUB_OUTPUT

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.2'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}
